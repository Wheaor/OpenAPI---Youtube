openapi: 3.1.0
info:
  title: API de Catálogo Editorial y Derechos - YouTube
  version: 1.0.0


  #Descripción de Responsabilidad
  description: |
    Definir qué contenido existe públicamente y bajo qué reglas puede mostrarse. Permite vincular un Asset técnico (proveniente del contexto de Publicación) con su metadata editorial (título, descripción, tags, categoría y miniatura) dando origen a un Ítem de Catálogo, que puede mantenerse en estado Borrador antes de ser Publicado o Despublicado. Cada Canal asociado a un creador administra su información pública y el listado de su contenido publicado, así como Playlists: colecciones ordenadas de ítems que pueden reordenarse libremente. El contexto aplica Restricciones de Política (edad mínima, bloqueo geográfico, limitación de monetización) y resuelve Reclamaciones de Derechos sobre un ítem, pudiendo restringir su disponibilidad como consecuencia de ellas, manteniendo siempre el historial de estado de política de cada contenido. Notifica a otros contextos cuando un ítem cambia su condición de publicado o deja de estarlo.


  contact:
    name: Equipo de Arquitectura de Software - UOH 2026

paths:


  # RF-C1 — Gestión de canales


  /canales:
    post:
      summary: Crear un canal editorial
      description: |
        Registra un nuevo canal asociado a un creador (RF-C1).
        El canal se crea con la información pública básica y queda en estado activo.
        El `idCreador` es un identificador externo proveniente del sistema de identidad compartido.
      operationId: crearCanal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idCreador, nombre]
              properties:
                idCreador:
                  type: string
                  format: uuid
                  description: Identificador del creador en el sistema de identidad compartido.
                  example: ["a1b2c3d4-e5f6-7890-abcd-ef1234567890"]
                nombre:
                  type: string
                  maxLength: 100
                  example: ["Canal de Viajes Luisito"]
                descripcion:
                  type: string
                  maxLength: 1000
                  example: ["Vlogs de viaje por Sudamérica y el mundo."]
                urlImagenPerfil:
                  type: string
                  format: uri
                  example: ["https://storage.yt.example/avatares/luisito.jpg"]
      responses:
        '201':
          description: Canal creado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Canal'
        '400':
          description: Datos de entrada inválidos (ej. nombre vacío o demasiado largo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El creador ya tiene un canal registrado en este contexto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /canales/{idCanal}:
    get:
      summary: Consultar el perfil editorial de un canal
      description: Retorna la información pública del canal, incluyendo nombre, descripción e imagen (RF-C1).
      operationId: obtenerCanal
      parameters:
        - $ref: '#/components/parameters/idCanal'
      responses:
        '200':
          description: Perfil editorial del canal recuperado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Canal'
        '404':
          description: El canal especificado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      summary: Actualizar el perfil editorial de un canal
      description: |
        Permite al creador modificar la información pública de su canal: nombre, descripción
        o imagen de perfil (RF-C1). Solo se actualizan los campos presentes en el body.
      operationId: actualizarCanal
      parameters:
        - $ref: '#/components/parameters/idCanal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  maxLength: 100
                  example: ["Canal de Viajes Luisito — Temporada 2"]
                descripcion:
                  type: string
                  maxLength: 1000
                  example: ["Vlogs de viaje, cultura y gastronomía."]
                urlImagenPerfil:
                  type: string
                  format: uri
                  example: ["https://storage.yt.example/avatares/luisito-v2.jpg"]
      responses:
        '200':
          description: Canal actualizado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Canal'
        '400':
          description: Datos de entrada inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El canal especificado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /canales/{idCanal}/contenidos:
    get:
      summary: Listar el contenido publicado de un canal
      description: |
        Retorna un listado paginado de los ítems de catálogo publicados que pertenecen
        al canal (RF-C1 / RNF-3). Solo se incluyen contenidos en estado 'Publicado'
        y visibles según las restricciones activas.
      operationId: listarContenidosPorCanal
      parameters:
        - $ref: '#/components/parameters/idCanal'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: categoria
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CategoriaContenido'
          description: Filtra por categoría editorial.
      responses:
        '200':
          description: Listado de contenidos publicados recuperado exitosamente (paginado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaContenidos'
        '400':
          description: Parámetros de paginación inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El canal especificado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

 
  # RF-C2 / RF-C3 — Contenido editorial
 

  /contenidos:
    post:
      summary: Crear un ítem de catálogo vinculando un asset técnico
      description: |
        Vincula un asset técnico procesado (proveniente del Contexto de Publicación) con
        metadata editorial, creando un nuevo ítem de catálogo en estado 'Borrador' (RF-C2).
        El `idAsset` debe corresponder a un asset que ya completó su procesamiento técnico,
        lo que se garantiza mediante el evento `assetListoParaPublicacion` recibido desde
        Publicación. El ítem no será visible al público hasta que el creador lo publique (RF-C3).
      operationId: crearItemCatalogo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idAsset, idCanal, titulo]
              properties:
                idAsset:
                  type: string
                  format: uuid
                  description: |
                    Identificador del asset técnico en el Contexto de Publicación (RNF-2).
                    Este ID es la referencia de integración entre contextos; Catálogo no
                    duplica los datos técnicos del asset.
                  example: ["d3b07384-d113-4956-a5db-2d1b331a0f2c"]
                idCanal:
                  type: string
                  format: uuid
                  description: Canal editorial al que pertenece este contenido (RNF-2).
                  example: ["3fa85f64-5717-4562-b3fc-2c963f66afa6"]
                titulo:
                  type: string
                  maxLength: 255
                  example: ["Vlog Patagonia Ep. 3 — Torres del Paine"]
                descripcion:
                  type: string
                  maxLength: 5000
                  example: ["Tercer episodio de la serie: tres días en el parque nacional."]
                tags:
                  type: array
                  items:
                    type: string
                    maxLength: 50
                  maxItems: 30
                  example: [["viaje", "patagonia", "chile", "naturaleza"]]
                categoria:
                  $ref: '#/components/schemas/CategoriaContenido'
                urlMiniatura:
                  type: string
                  format: uri
                  example: ["https://storage.yt.example/miniaturas/patagonia-ep3.jpg"]
      responses:
        '201':
          description: Ítem de catálogo creado exitosamente en estado Borrador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCatalogo'
        '400':
          description: Datos de entrada inválidos o asset no disponible para publicación editorial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ya existe un ítem de catálogo vinculado a este asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /contenidos/{idItemCatalogo}:
    get:
      summary: Consultar el detalle editorial de un ítem de catálogo
      description: |
        Retorna la metadata editorial completa de un ítem de catálogo (RF-C2).
        Incluye título, descripción, tags, categoría, miniatura, estado de visibilidad
        y restricciones activas. No incluye datos técnicos del asset (duración,
        calidades disponibles), que deben consultarse en el Contexto de Publicación.
      operationId: obtenerItemCatalogo
      parameters:
        - $ref: '#/components/parameters/idItemCatalogo'
      responses:
        '200':
          description: Detalle editorial recuperado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCatalogoDetalle'
        '404':
          description: El ítem de catálogo especificado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      summary: Editar la metadata editorial de un ítem de catálogo
      description: |
        Permite al creador actualizar título, descripción, tags, categoría o miniatura
        de un ítem existente (RF-C2). Solo se actualizan los campos presentes en el body.
        La edición está disponible en cualquier estado de visibilidad.
      operationId: editarItemCatalogo
      parameters:
        - $ref: '#/components/parameters/idItemCatalogo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                titulo:
                  type: string
                  maxLength: 255
                  example: ["Vlog Patagonia Ep. 3 — Torres del Paine (versión extendida)"]
                descripcion:
                  type: string
                  maxLength: 5000
                  example: ["Versión extendida con material de detrás de cámara."]
                tags:
                  type: array
                  items:
                    type: string
                    maxLength: 50
                  maxItems: 30
                  example: [["viaje", "patagonia", "chile", "naturaleza", "camping"]]
                categoria:
                  $ref: '#/components/schemas/CategoriaContenido'
                urlMiniatura:
                  type: string
                  format: uri
                  example: ["https://storage.yt.example/miniaturas/patagonia-ep3-v2.jpg"]
      responses:
        '200':
          description: Metadata editorial actualizada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCatalogo'
        '400':
          description: Datos de entrada inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El ítem de catálogo especificado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /contenidos/{idItemCatalogo}/estado:
    patch:
      summary: Publicar o despublicar un ítem de catálogo
      description: |
        Controla la visibilidad pública de un ítem de catálogo (RF-C3).
        Al publicar, el sistema emite el evento `contenidoPublicado` hacia los contextos
        de Descubrimiento, Monetización y Publicidad. Al despublicar, emite `contenidoDespublicado`.
        No es posible publicar un ítem que tenga restricciones activas de tipo bloqueante.
        Transiciones permitidas:
        - Borrador → Publicado
        - Publicado → Despublicado
        - Despublicado → Publicado
        El estado 'Restringido' solo puede ser asignado por el sistema ante reclamaciones
        o políticas, no por el creador directamente.
      operationId: cambiarEstadoVisibilidad
      parameters:
        - $ref: '#/components/parameters/idItemCatalogo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estadoVisibilidad]
              properties:
                estadoVisibilidad:
                  type: string
                  enum: [Publicado, Despublicado]
                  example: ["Publicado"]
                motivoDespublicacion:
                  type: string
                  maxLength: 500
                  description: Razón opcional cuando el creador decide despublicar el contenido.
                  example: ["Contenido siendo reeditado para la versión extendida."]
      responses:
        '200':
          description: Estado de visibilidad actualizado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCatalogo'
        '400':
          description: Transición de estado inválida o ítem con restricciones bloqueantes activas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El ítem de catálogo especificado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El ítem ya se encuentra en el estado solicitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /contenidos/{idItemCatalogo}/visibilidad:
    get:
      summary: Consultar si un contenido es visible para un espectador dado
      description: |
        Evalúa si un ítem de catálogo puede ser mostrado a un espectador según su país,
        edad y el estado de moderación actual del contenido (RF-C3).
        Este endpoint es consumido principalmente por los contextos de Descubrimiento
        y Publicidad para validar elegibilidad antes de recomendar o monetizar.
        Opera bajo consistencia eventual: si el estado del contenido cambió recientemente,
        puede haber un breve período de desincronización con otros contextos (RNF-5).
      operationId: consultarVisibilidadContenido
      parameters:
        - $ref: '#/components/parameters/idItemCatalogo'
        - name: pais
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 2
            pattern: '^[A-Z]{2}$'
          description: Código de país ISO 3166-1 alpha-2 del espectador.
          example: ["CL"]
        - name: edad
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 120
          description: Edad del espectador en años. Si no se provee, se asume usuario no autenticado (máxima restricción etaria).
          example: [25]
      responses:
        '200':
          description: Evaluación de visibilidad completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoVisibilidad'
        '400':
          description: Parámetros de consulta inválidos (ej. código de país mal formado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El ítem de catálogo especificado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  # RF-C4 — Playlists
 

  /playlists:
    post:
      summary: Crear una nueva playlist
      description: Crea una colección ordenada de contenidos editoriales asociada a un canal (RF-C4).
      operationId: crearPlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idCanal, titulo]
              properties:
                idCanal:
                  type: string
                  format: uuid
                  example: ["3fa85f64-5717-4562-b3fc-2c963f66afa6"]
                titulo:
                  type: string
                  maxLength: 255
                  example: ["Serie Patagonia — Temporada 1"]
                descripcion:
                  type: string
                  maxLength: 2000
                  example: ["Todos los episodios del viaje por la Patagonia chilena y argentina."]
                visibilidad:
                  type: string
                  enum: [Publica, Privada, NoListada]
                  default: Publica
                  description: |
                    Controla quién puede ver la playlist.
                    'Publica': visible para todos. 'Privada': solo el creador.
                    'NoListada': accesible con el enlace directo pero no aparece en el canal.
                  example: ["Publica"]
      responses:
        '201':
          description: Playlist creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          description: Datos de entrada inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El canal especificado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /playlists/{idPlaylist}:
    get:
      summary: Consultar una playlist con sus ítems ordenados
      description: Retorna la metadata de la playlist y la lista ordenada de ítems de catálogo que contiene (RF-C4).
      operationId: obtenerPlaylist
      parameters:
        - $ref: '#/components/parameters/idPlaylist'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Playlist recuperada exitosamente con su orden de ítems.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistDetalle'
        '404':
          description: La playlist especificada no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      summary: Actualizar la metadata de una playlist
      description: Permite modificar el título, descripción o visibilidad de una playlist (RF-C4).
      operationId: actualizarPlaylist
      parameters:
        - $ref: '#/components/parameters/idPlaylist'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                titulo:
                  type: string
                  maxLength: 255
                  example: ["Serie Patagonia — Colección Completa"]
                descripcion:
                  type: string
                  maxLength: 2000
                  example: ["Temporadas 1 y 2 completas."]
                visibilidad:
                  type: string
                  enum: [Publica, Privada, NoListada]
                  example: ["NoListada"]
      responses:
        '200':
          description: Playlist actualizada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          description: Datos de entrada inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: La playlist especificada no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Eliminar una playlist
      description: Elimina la playlist y todas sus asociaciones de ítems. No elimina los ítems de catálogo en sí (RF-C4).
      operationId: eliminarPlaylist
      parameters:
        - $ref: '#/components/parameters/idPlaylist'
      responses:
        '204':
          description: Playlist eliminada exitosamente.
        '404':
          description: La playlist especificada no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /playlists/{idPlaylist}/items:
    post:
      summary: Agregar un ítem de catálogo a una playlist
      description: Agrega un ítem al final de la playlist (RF-C4). El ítem debe existir en el catálogo.
      operationId: agregarItemPlaylist
      parameters:
        - $ref: '#/components/parameters/idPlaylist'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idItemCatalogo]
              properties:
                idItemCatalogo:
                  type: string
                  format: uuid
                  example: ["7c9e6679-7425-40de-944b-e07fc1f90ae7"]
      responses:
        '200':
          description: Ítem agregado exitosamente. Retorna la playlist actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistDetalle'
        '400':
          description: El ítem no existe en el catálogo o ya está en la playlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: La playlist especificada no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /playlists/{idPlaylist}/items/{idItemCatalogo}:
    delete:
      summary: Quitar un ítem de catálogo de una playlist
      description: Elimina la asociación entre el ítem y la playlist, sin eliminar el ítem del catálogo (RF-C4).
      operationId: quitarItemPlaylist
      parameters:
        - $ref: '#/components/parameters/idPlaylist'
        - $ref: '#/components/parameters/idItemCatalogo'
      responses:
        '200':
          description: Ítem eliminado de la playlist exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistDetalle'
        '404':
          description: La playlist o el ítem especificado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /playlists/{idPlaylist}/items/orden:
    put:
      summary: Reordenar los ítems de una playlist
      description: |
        Reemplaza el orden actual de la playlist con el array de IDs proporcionado (RF-C4).
        El array debe contener exactamente los mismos `idItemCatalogo` que ya están en la
        playlist, sin agregar ni quitar ítems.
      operationId: reordenarItemsPlaylist
      parameters:
        - $ref: '#/components/parameters/idPlaylist'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ordenIds]
              properties:
                ordenIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                  description: Array de idItemCatalogo en el nuevo orden deseado.
                  example: [["7c9e6679-7425-40de-944b-e07fc1f90ae7", "a2b3c4d5-e6f7-8901-bcde-f12345678901"]]
      responses:
        '200':
          description: Orden actualizado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistDetalle'
        '400':
          description: El array no contiene exactamente los ítems actuales de la playlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: La playlist especificada no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  
  # RF-C5 — Derechos y reclamaciones
 

  /contenidos/{idItemCatalogo}/reclamaciones:
    get:
      summary: Listar reclamaciones de derechos sobre un contenido
      description: Retorna el historial de reclamaciones asociadas a un ítem de catálogo (RF-C5).
      operationId: listarReclamaciones
      parameters:
        - $ref: '#/components/parameters/idItemCatalogo'
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoReclamacion'
          description: Filtra por estado de reclamación.
      responses:
        '200':
          description: Listado de reclamaciones recuperado exitosamente.
          content:
            application/json:
              schema:
                type: object
                required: [data, totalRecords]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reclamacion'
                  totalRecords:
                    type: integer
                    example: [2]
        '404':
          description: El ítem de catálogo especificado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Registrar una reclamación de derechos sobre un contenido
      description: |
        Permite a un titular de derechos registrar una reclamación sobre un ítem de catálogo
        (RF-C5). Al registrarse, el sistema evalúa si la reclamación activa una restricción
        automática sobre la visibilidad del contenido (ej. bloqueo territorial). Se emite el
        evento `reclamacionCreada`.
      operationId: crearReclamacion
      parameters:
        - $ref: '#/components/parameters/idItemCatalogo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idReclamante, tipoReclamacion, descripcion]
              properties:
                idReclamante:
                  type: string
                  format: uuid
                  description: Identificador del titular de derechos en el sistema de identidad compartido.
                  example: ["f1a2b3c4-d5e6-7890-abcd-ef1234567890"]
                tipoReclamacion:
                  $ref: '#/components/schemas/TipoReclamacion'
                descripcion:
                  type: string
                  maxLength: 2000
                  example: ["El fragmento entre 01:23 y 02:45 utiliza composición musical protegida sin licencia."]
                territoriosAfectados:
                  type: array
                  items:
                    type: string
                    minLength: 2
                    maxLength: 2
                  description: Códigos de país ISO 3166-1 alpha-2 donde aplica la reclamación. Si está vacío, aplica globalmente.
                  example: [["CL", "AR", "MX"]]
                urlEvidencia:
                  type: string
                  format: uri
                  description: Enlace opcional a documentación de respaldo de la reclamación.
                  example: ["https://derechos.example/evidencia/caso-12345.pdf"]
      responses:
        '201':
          description: Reclamación registrada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reclamacion'
        '400':
          description: Datos de entrada inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El ítem de catálogo especificado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /contenidos/{idItemCatalogo}/reclamaciones/{idReclamacion}:
    patch:
      summary: Resolver una reclamación de derechos
      description: |
        Permite a un moderador o administrador del sistema resolver una reclamación activa,
        aceptándola, disputándola o retirándola (RF-C5). La resolución puede modificar
        el estado de visibilidad del contenido y sus restricciones activas. Se emite el
        evento `reclamacionResuelta`.
      operationId: resolverReclamacion
      parameters:
        - $ref: '#/components/parameters/idItemCatalogo'
        - name: idReclamacion
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolucion]
              properties:
                resolucion:
                  type: string
                  enum: [Aceptada, Disputada, Retirada]
                  description: |
                    'Aceptada': el contenido queda restringido según los territorios de la reclamación.
                    'Disputada': el creador impugna la reclamación; queda pendiente de revisión adicional.
                    'Retirada': el reclamante retira la reclamación; se levantan las restricciones asociadas.
                  example: ["Aceptada"]
                motivoResolucion:
                  type: string
                  maxLength: 1000
                  example: ["Reclamación validada con la documentación de derechos aportada."]
      responses:
        '200':
          description: Reclamación resuelta exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reclamacion'
        '400':
          description: Resolución inválida para el estado actual de la reclamación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El ítem de catálogo o la reclamación especificados no existen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La reclamación ya fue resuelta y no admite más cambios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

 
  # RF-C6 — Políticas y restricciones
 

  /contenidos/{idItemCatalogo}/restricciones:
    get:
      summary: Consultar las restricciones y el historial de política de un contenido
      description: |
        Retorna las restricciones activas y el historial completo de cambios de política
        de un ítem de catálogo (RF-C6). Incluye restricciones de edad, territoriales,
        de monetización y de moderación.
      operationId: obtenerRestriccionesContenido
      parameters:
        - $ref: '#/components/parameters/idItemCatalogo'
      responses:
        '200':
          description: Restricciones y historial de política recuperados exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoPoliticaContenido'
        '404':
          description: El ítem de catálogo especificado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Aplicar una restricción de contenido
      description: |
        Permite a un moderador o sistema administrativo aplicar una restricción sobre un
        ítem de catálogo (RF-C6). Según el tipo de restricción, puede modificar la
        visibilidad efectiva del contenido. Se emite el evento `restriccionAplicada`.
      operationId: aplicarRestriccion
      parameters:
        - $ref: '#/components/parameters/idItemCatalogo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipoRestriccion, motivo]
              properties:
                tipoRestriccion:
                  $ref: '#/components/schemas/TipoRestriccion'
                motivo:
                  type: string
                  maxLength: 1000
                  example: ["Contenido clasificado para mayores de 18 años por la junta de revisión de políticas."]
                edadMinima:
                  type: integer
                  minimum: 0
                  maximum: 21
                  description: Requerido cuando tipoRestriccion es 'RestriccionEtaria'.
                  example: [18]
                territoriosBloqueados:
                  type: array
                  items:
                    type: string
                    minLength: 2
                    maxLength: 2
                  description: Requerido cuando tipoRestriccion es 'BloqueGeografico'.
                  example: [["CN", "RU"]]
                monetizacionLimitada:
                  type: boolean
                  description: Requerido cuando tipoRestriccion es 'LimitacionMonetizacion'.
                  example: [true]
      responses:
        '201':
          description: Restricción aplicada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restriccion'
        '400':
          description: Datos de restricción inválidos o incompletos para el tipo especificado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El ítem de catálogo especificado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /contenidos/{idItemCatalogo}/restricciones/{idRestriccion}:
    delete:
      summary: Levantar una restricción de contenido
      description: |
        Elimina una restricción activa sobre un ítem de catálogo (RF-C6). Si el ítem
        estaba en estado 'Restringido' y ya no quedan restricciones bloqueantes, su
        visibilidad vuelve al estado anterior. Se emite el evento `restriccionLevantada`.
      operationId: levantarRestriccion
      parameters:
        - $ref: '#/components/parameters/idItemCatalogo'
        - name: idRestriccion
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Restricción levantada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoPoliticaContenido'
        '404':
          description: El ítem de catálogo o la restricción especificados no existen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La restricción ya fue levantada anteriormente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Autenticación basada en JSON Web Tokens (JWT).
        El token debe incluir los claims de identidad y rol.
        Roles válidos en este contexto: Creador, Moderador, Sistema.

  parameters:
    idCanal:
      name: idCanal
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Identificador único del canal editorial.
      example:
        default:
          value: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    idItemCatalogo:
      name: idItemCatalogo
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Identificador único del ítem de catálogo.
      example:
        default:
          value: "7c9e6679-7425-40de-944b-e07fc1f90ae7"

    idPlaylist:
      name: idPlaylist
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Identificador único de la playlist.
      example:
        default:
          value: "b5c6d7e8-f9a0-4b1c-2d3e-4f5a6b7c8d9e"

    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Número de página a recuperar (RNF-3).

    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Cantidad máxima de registros por página (RNF-3).

  schemas:

    # ─── ENUMERADOS ───

    EstadoVisibilidad:
      type: string
      enum: [Borrador, Publicado, Despublicado, Restringido]
      description: |
        Ciclo de vida editorial de un ítem de catálogo.
        - Borrador: el asset está vinculado pero el contenido no es público.
        - Publicado: visible según las restricciones activas.
        - Despublicado: el creador lo retiró manualmente.
        - Restringido: el sistema lo bloqueó por reclamación o política (no puede cambiarlo el creador directamente).

    CategoriaContenido:
      type: string
      enum:
        [Musica, Gaming, Educacion, Tecnologia, Viajes, Cocina, Deportes,
         Entretenimiento, Noticias, Ciencia, Moda, Comedia, Mascotas, Automovilismo, Otro]
      description: Categoría editorial del contenido.

    TipoRestriccion:
      type: string
      enum: [RestriccionEtaria, BloqueGeografico, LimitacionMonetizacion, SuspensionMoederacion]
      description: |
        Tipo de restricción aplicable a un ítem de catálogo.
        - RestriccionEtaria: requiere edad mínima para visualizar.
        - BloqueGeografico: no visible en ciertos territorios.
        - LimitacionMonetizacion: no apto para publicidad ni ingresos del creador.
        - SuspensionModeracion: suspendido por revisión de políticas de la plataforma.

    TipoReclamacion:
      type: string
      enum: [DerechosAutor, MarcaRegistrada, Privacidad, Otro]
      description: Tipo de reclamación de derechos sobre un contenido.

    EstadoReclamacion:
      type: string
      enum: [Pendiente, Aceptada, Disputada, Retirada]
      description: Estado de resolución de una reclamación de derechos.

    VisibilidadPlaylist:
      type: string
      enum: [Publica, Privada, NoListada]
      description: Nivel de acceso público de una playlist.

    # ─── MODELOS DE DATOS ───

    Canal:
      type: object
      required: [idCanal, idCreador, nombre, fechaCreacion]
      properties:
        idCanal:
          type: string
          format: uuid
          readOnly: true
          description: Identificador único del canal (RNF-2). Compartido como referencia con otros contextos.
          example: ["3fa85f64-5717-4562-b3fc-2c963f66afa6"]
        idCreador:
          type: string
          format: uuid
          description: Identificador del creador en el sistema de identidad compartido.
          example: ["a1b2c3d4-e5f6-7890-abcd-ef1234567890"]
        nombre:
          type: string
          maxLength: 100
          example: ["Canal de Viajes Marcelo"]
        descripcion:
          type: [string, "null"]
          maxLength: 1000
          example: ["Vlogs de viaje por Sudamérica y el mundo."]
        urlImagenPerfil:
          type: [string, "null"]
          format: uri
          example: ["https://storage.yt.example/avatares/marcelo.jpg"]
        fechaCreacion:
          type: string
          format: date-time
          readOnly: true
          example: ["2026-01-15T10:00:00Z"]

    ItemCatalogo:
      type: object
      description: |
        Representación editorial de un contenido en el catálogo. En este contexto, el video
        es un ítem de catálogo, no un archivo técnico. Los datos de duración y calidades
        disponibles residen en el Contexto de Publicación y se acceden mediante el idAsset.
      required: [idItemCatalogo, idAsset, idCanal, titulo, estadoVisibilidad, fechaCreacion]
      properties:
        idItemCatalogo:
          type: string
          format: uuid
          readOnly: true
          description: Identificador único del ítem en el catálogo editorial.
          example: ["7c9e6679-7425-40de-944b-e07fc1f90ae7"]
        idAsset:
          type: string
          format: uuid
          description: Referencia al asset técnico en el Contexto de Publicación (RNF-2).
          example: ["d3b07384-d113-4956-a5db-2d1b331a0f2c"]
        idCanal:
          type: string
          format: uuid
          description: Canal al que pertenece este contenido (RNF-2).
          example: ["3fa85f64-5717-4562-b3fc-2c963f66afa6"]
        titulo:
          type: string
          maxLength: 255
          example: ["Vlog Patagonia Ep. 3 — Torres del Paine"]
        descripcion:
          type: [string, "null"]
          maxLength: 5000
          example: ["Tercer episodio de la serie: tres días en el parque nacional."]
        tags:
          type: array
          items:
            type: string
          example: [["viaje", "patagonia", "chile", "naturaleza"]]
        categoria:
          oneOf:
            - $ref: '#/components/schemas/CategoriaContenido'
            - type: "null"
        urlMiniatura:
          type: [string, "null"]
          format: uri
          example: ["https://storage.yt.example/miniaturas/patagonia-ep3.jpg"]
        estadoVisibilidad:
          $ref: '#/components/schemas/EstadoVisibilidad'
        fechaCreacion:
          type: string
          format: date-time
          readOnly: true
          example: ["2026-06-15T22:10:00Z"]
        fechaPublicacion:
          type: [string, "null"]
          format: date-time
          readOnly: true
          description: Fecha en que el ítem pasó por primera vez a estado 'Publicado'.
          example: ["2026-06-16T09:00:00Z"]

    ItemCatalogoDetalle:
      type: object
      description: Vista extendida del ítem de catálogo, incluye restricciones activas.
      allOf:
        - $ref: '#/components/schemas/ItemCatalogo'
        - type: object
          properties:
            restriccionesActivas:
              type: array
              items:
                $ref: '#/components/schemas/Restriccion'
              description: Lista de restricciones actualmente vigentes sobre el contenido.
            reclamacionesPendientes:
              type: integer
              readOnly: true
              description: Cantidad de reclamaciones en estado 'Pendiente' o 'Disputada'.
              example: [0]

    PaginaContenidos:
      type: object
      required: [data, totalRecords, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ItemCatalogo'
        totalRecords:
          type: integer
          example: [54]
        page:
          type: integer
          example: [1]
        limit:
          type: integer
          example: [20]

    ResultadoVisibilidad:
      type: object
      required: [idItemCatalogo, visible, estadoVisibilidad]
      description: Resultado de la evaluación de visibilidad para un espectador dado (RF-C3).
      properties:
        idItemCatalogo:
          type: string
          format: uuid
          example: ["7c9e6679-7425-40de-944b-e07fc1f90ae7"]
        visible:
          type: boolean
          description: Indica si el contenido puede ser mostrado al espectador con los parámetros dados.
          example: [true]
        estadoVisibilidad:
          $ref: '#/components/schemas/EstadoVisibilidad'
        motivoNoVisibilidad:
          type: [string, "null"]
          description: Presente cuando 'visible' es false. Explica la razón de la restricción.
          enum:
            - CONTENIDO_NO_PUBLICADO
            - BLOQUEO_GEOGRAFICO
            - RESTRICCION_ETARIA
            - SUSPENSION_MODERACION
            - null
          example: [null]

    Playlist:
      type: object
      required: [idPlaylist, idCanal, titulo, visibilidad, fechaCreacion]
      properties:
        idPlaylist:
          type: string
          format: uuid
          readOnly: true
          example: ["b5c6d7e8-f9a0-4b1c-2d3e-4f5a6b7c8d9e"]
        idCanal:
          type: string
          format: uuid
          example: ["3fa85f64-5717-4562-b3fc-2c963f66afa6"]
        titulo:
          type: string
          maxLength: 255
          example: ["Serie Patagonia — Temporada 1"]
        descripcion:
          type: [string, "null"]
          maxLength: 2000
          example: ["Todos los episodios del viaje por la Patagonia chilena y argentina."]
        visibilidad:
          $ref: '#/components/schemas/VisibilidadPlaylist'
        totalItems:
          type: integer
          readOnly: true
          description: Cantidad total de ítems en la playlist.
          example: [5]
        fechaCreacion:
          type: string
          format: date-time
          readOnly: true
          example: ["2026-06-10T08:00:00Z"]

    ItemPlaylist:
      type: object
      required: [idItemCatalogo, posicion]
      description: Asociación ordenada entre un ítem de catálogo y una playlist.
      properties:
        posicion:
          type: integer
          minimum: 1
          description: Posición del ítem dentro del orden de la playlist (1-indexed).
          example: [1]
        idItemCatalogo:
          type: string
          format: uuid
          example: ["7c9e6679-7425-40de-944b-e07fc1f90ae7"]
        titulo:
          type: string
          description: Título del ítem en el momento de la consulta (desnormalizado para eficiencia de lectura).
          example: ["Vlog Patagonia Ep. 3 — Torres del Paine"]
        urlMiniatura:
          type: [string, "null"]
          format: uri
          example: ["https://storage.yt.example/miniaturas/patagonia-ep3.jpg"]

    PlaylistDetalle:
      type: object
      description: Vista extendida de la playlist con sus ítems ordenados y paginación.
      allOf:
        - $ref: '#/components/schemas/Playlist'
        - type: object
          required: [items, totalRecords, page, limit]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ItemPlaylist'
            totalRecords:
              type: integer
              example: [5]
            page:
              type: integer
              example: [1]
            limit:
              type: integer
              example: [20]

    Reclamacion:
      type: object
      required: [idReclamacion, idItemCatalogo, idReclamante, tipoReclamacion, descripcion, estado, fechaCreacion]
      properties:
        idReclamacion:
          type: string
          format: uuid
          readOnly: true
          example: ["c1d2e3f4-a5b6-4789-0abc-def123456789"]
        idItemCatalogo:
          type: string
          format: uuid
          example: ["7c9e6679-7425-40de-944b-e07fc1f90ae7"]
        idReclamante:
          type: string
          format: uuid
          example: ["f1a2b3c4-d5e6-7890-abcd-ef1234567890"]
        tipoReclamacion:
          $ref: '#/components/schemas/TipoReclamacion'
        descripcion:
          type: string
          example: ["El fragmento entre 01:23 y 02:45 utiliza composición musical protegida sin licencia."]
        territoriosAfectados:
          type: array
          items:
            type: string
          example: [["CL", "AR", "MX"]]
        urlEvidencia:
          type: [string, "null"]
          format: uri
          example: [null]
        estado:
          $ref: '#/components/schemas/EstadoReclamacion'
        resolucion:
          type: [string, "null"]
          enum: [Aceptada, Disputada, Retirada, null]
          description: Presente únicamente cuando el estado es distinto de 'Pendiente'.
          example: [null]
        motivoResolucion:
          type: [string, "null"]
          example: [null]
        fechaCreacion:
          type: string
          format: date-time
          readOnly: true
          example: ["2026-06-17T14:00:00Z"]
        fechaResolucion:
          type: [string, "null"]
          format: date-time
          readOnly: true
          example: [null]

    Restriccion:
      type: object
      required: [idRestriccion, idItemCatalogo, tipoRestriccion, motivo, activa, fechaAplicacion]
      properties:
        idRestriccion:
          type: string
          format: uuid
          readOnly: true
          example: ["e1f2a3b4-c5d6-4789-0abc-ef1234567890"]
        idItemCatalogo:
          type: string
          format: uuid
          example: ["7c9e6679-7425-40de-944b-e07fc1f90ae7"]
        tipoRestriccion:
          $ref: '#/components/schemas/TipoRestriccion'
        motivo:
          type: string
          example: ["Contenido clasificado para mayores de 18 años."]
        edadMinima:
          type: [integer, "null"]
          example: [18]
        territoriosBloqueados:
          type: array
          items:
            type: string
          example: [[]]
        monetizacionLimitada:
          type: [boolean, "null"]
          example: [null]
        activa:
          type: boolean
          description: Indica si la restricción está vigente actualmente.
          example: [true]
        fechaAplicacion:
          type: string
          format: date-time
          readOnly: true
          example: ["2026-06-18T10:00:00Z"]
        fechaLevantamiento:
          type: [string, "null"]
          format: date-time
          readOnly: true
          example: [null]

    EstadoPoliticaContenido:
      type: object
      required: [idItemCatalogo, restriccionesActivas, historial]
      description: Estado de política actual e historial de cambios de un contenido (RF-C6).
      properties:
        idItemCatalogo:
          type: string
          format: uuid
          example: ["7c9e6679-7425-40de-944b-e07fc1f90ae7"]
        restriccionesActivas:
          type: array
          items:
            $ref: '#/components/schemas/Restriccion'
          description: Restricciones actualmente vigentes sobre el contenido.
        historial:
          type: array
          items:
            $ref: '#/components/schemas/Restriccion'
          description: Historial completo de restricciones (activas y levantadas) ordenado por fecha descendente.

    ErrorResponse:
      type: object
      required: [codigo, mensaje, timestamp]
      properties:
        codigo:
          type: string
          description: Código de error interno para mapeo semántico.
          example: ["ASSET_YA_VINCULADO"]
        mensaje:
          type: string
          description: Descripción del error para el desarrollador o cliente.
          example: ["Ya existe un ítem de catálogo vinculado al asset especificado."]
        timestamp:
          type: string
          format: date-time
          example: ["2026-06-15T22:10:00Z"]
        detalles:
          type: array
          items:
            type: string
          description: Lista opcional con errores específicos de validación de campos.

webhooks:

  # ─── EVENTOS CONSUMIDOS (entrada) ───

  assetListoParaPublicacion:
    post:
      summary: Recibir notificación de asset técnicamente listo (desde Publicación)
      description: |
        Evento asíncrono consumido desde el Contexto de Publicación cuando un asset
        completó su procesamiento técnico exitosamente (RF-P2 / RF-C2 / RNF-4).
        Al recibirlo, este contexto puede crear un ítem de catálogo en estado 'Borrador'
        o notificar al creador que el asset está disponible para publicación editorial.
        El `idAsset` recibido es la referencia de integración entre contextos (RNF-2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idEvento, idAsset, idCanal, duracionSegundos, calidadesGeneradas, timestamp]
              properties:
                idEvento:
                  type: string
                  format: uuid
                  example: ["c3d4e5f6-a7b8-4c9d-0e1f-2a3b4c5d6e7f"]
                idAsset:
                  type: string
                  format: uuid
                  description: Identificador técnico del asset. Catálogo lo referencia en su ItemCatalogo.
                  example: ["d3b07384-d113-4956-a5db-2d1b331a0f2c"]
                idCanal:
                  type: string
                  format: uuid
                  example: ["3fa85f64-5717-4562-b3fc-2c963f66afa6"]
                duracionSegundos:
                  type: integer
                  minimum: 0
                  example: [842]
                calidadesGeneradas:
                  type: array
                  items:
                    type: string
                  example: [["360p", "720p", "1080p"]]
                timestamp:
                  type: string
                  format: date-time
                  example: ["2026-06-15T22:06:00Z"]
      responses:
        '202':
          description: Evento recibido y aceptado para procesamiento asíncrono.
        '500':
          description: Error en el receptor. El broker reintentará el envío.

  transmisionVivoCambioEstado:
    post:
      summary: Recibir notificación de cambio de estado de transmisión en vivo (desde Publicación)
      description: |
        Evento asíncrono consumido desde el Contexto de Publicación cuando una transmisión
        en vivo finaliza y genera un asset grabado (RF-P4 / RNF-4). Permite a Catálogo
        saber que hay un nuevo asset técnico disponible para su eventual publicación editorial.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idEvento, idTransmision, idCanal, estado, timestamp]
              properties:
                idEvento:
                  type: string
                  format: uuid
                  example: ["e5f6a7b8-c9d0-4e1f-2a3b-4c5d6e7f8a9b"]
                idTransmision:
                  type: string
                  format: uuid
                  example: ["f1e2d3c4-b5a6-4978-8c9d-0e1f2a3b4c5d"]
                idCanal:
                  type: string
                  format: uuid
                  example: ["3fa85f64-5717-4562-b3fc-2c963f66afa6"]
                estado:
                  type: string
                  enum: [Configurada, EnVivo, Pausada, Finalizada]
                  example: ["Finalizada"]
                idAssetGrabacion:
                  type: [string, "null"]
                  format: uuid
                  description: Presente cuando 'estado' es 'Finalizada' y se generó grabación.
                  example: ["a1b2c3d4-e5f6-7890-abcd-ef1234567890"]
                timestamp:
                  type: string
                  format: date-time
                  example: ["2026-06-15T23:00:00Z"]
      responses:
        '202':
          description: Evento recibido y aceptado para procesamiento asíncrono.
        '500':
          description: Error en el receptor. El broker reintentará el envío.

  # ─── EVENTOS EMITIDOS (salida) ───

  contenidoPublicado:
    post:
      summary: Notificar que un contenido fue publicado (RF-C3 / RNF-4)
      description: |
        Evento asíncrono emitido cuando un ítem de catálogo pasa a estado 'Publicado'.
        Es consumido por:
        - Descubrimiento y personalización: para indexar el contenido y hacerlo buscable.
        - Monetización del ecosistema creador: para habilitarlo como elegible de ingresos.
        - Publicidad y marketplace: para incorporarlo al inventario publicitario disponible.
        Identifica tanto el ítem de catálogo editorial (idItemCatalogo) como el asset
        técnico subyacente (idAsset) para permitir la trazabilidad entre contextos (RNF-2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idEvento, idItemCatalogo, idAsset, idCanal, titulo, categoria, timestamp]
              properties:
                idEvento:
                  type: string
                  format: uuid
                  example: ["a9b8c7d6-e5f4-4321-0fed-cba987654321"]
                idItemCatalogo:
                  type: string
                  format: uuid
                  example: ["7c9e6679-7425-40de-944b-e07fc1f90ae7"]
                idAsset:
                  type: string
                  format: uuid
                  example: ["d3b07384-d113-4956-a5db-2d1b331a0f2c"]
                idCanal:
                  type: string
                  format: uuid
                  example: ["3fa85f64-5717-4562-b3fc-2c963f66afa6"]
                titulo:
                  type: string
                  example: ["Vlog Patagonia Ep. 3 — Torres del Paine"]
                categoria:
                  $ref: '#/components/schemas/CategoriaContenido'
                tags:
                  type: array
                  items:
                    type: string
                  example: [["viaje", "patagonia", "chile"]]
                restriccionesActivas:
                  type: array
                  items:
                    type: object
                    properties:
                      tipo:
                        $ref: '#/components/schemas/TipoRestriccion'
                      edadMinima:
                        type: [integer, "null"]
                      territoriosBloqueados:
                        type: array
                        items:
                          type: string
                  description: Restricciones vigentes al momento de la publicación, para que los contextos receptores puedan filtrar correctamente.
                timestamp:
                  type: string
                  format: date-time
                  example: ["2026-06-16T09:00:00Z"]
      responses:
        '202':
          description: Evento recibido por los contextos suscriptores.
        '500':
          description: Error en el receptor. El broker reintentará el envío.

  contenidoDespublicado:
    post:
      summary: Notificar que un contenido fue despublicado o restringido (RF-C3 / RNF-4)
      description: |
        Evento asíncrono emitido cuando un ítem de catálogo deja de estar disponible
        públicamente, ya sea por despublicación manual del creador o por una restricción
        aplicada por el sistema. Es consumido por:
        - Descubrimiento: para remover el contenido del índice de búsqueda y feeds.
        - Publicidad: para detener el ad serving sobre este contenido.
        Caso límite documentado (RNF-5): si un usuario está reproduciendo el video
        en el momento de la despublicación, la sesión de streaming activa en Publicación
        no se interrumpe automáticamente. Publicación es el guardián del stream técnico;
        Catálogo gestiona la elegibilidad editorial. La sincronización es eventual.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idEvento, idItemCatalogo, idAsset, idCanal, nuevoEstado, motivo, timestamp]
              properties:
                idEvento:
                  type: string
                  format: uuid
                  example: ["b0c1d2e3-f4a5-4678-9012-bcdef3456789"]
                idItemCatalogo:
                  type: string
                  format: uuid
                  example: ["7c9e6679-7425-40de-944b-e07fc1f90ae7"]
                idAsset:
                  type: string
                  format: uuid
                  example: ["d3b07384-d113-4956-a5db-2d1b331a0f2c"]
                idCanal:
                  type: string
                  format: uuid
                  example: ["3fa85f64-5717-4562-b3fc-2c963f66afa6"]
                nuevoEstado:
                  type: string
                  enum: [Despublicado, Restringido]
                  example: ["Despublicado"]
                motivo:
                  type: string
                  enum: [DECISION_CREADOR, RECLAMACION_DERECHOS, POLITICA_MODERACION]
                  example: ["DECISION_CREADOR"]
                timestamp:
                  type: string
                  format: date-time
                  example: ["2026-06-17T12:00:00Z"]
      responses:
        '202':
          description: Evento recibido por los contextos suscriptores.
        '500':
          description: Error en el receptor. El broker reintentará el envío.

  restriccionAplicada:
    post:
      summary: Notificar que se aplicó una restricción sobre un contenido (RF-C6 / RNF-4)
      description: |
        Evento asíncrono emitido cuando se aplica una nueva restricción sobre un ítem
        de catálogo. Permite a Descubrimiento y Publicidad ajustar su comportamiento
        de forma inmediata (ej. excluir el contenido de ciertos territorios o de
        inventario publicitario).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idEvento, idItemCatalogo, idAsset, idCanal, idRestriccion, tipoRestriccion, timestamp]
              properties:
                idEvento:
                  type: string
                  format: uuid
                  example: ["c1d2e3f4-a5b6-4789-0123-cdef45678901"]
                idItemCatalogo:
                  type: string
                  format: uuid
                  example: ["7c9e6679-7425-40de-944b-e07fc1f90ae7"]
                idAsset:
                  type: string
                  format: uuid
                  example: ["d3b07384-d113-4956-a5db-2d1b331a0f2c"]
                idCanal:
                  type: string
                  format: uuid
                  example: ["3fa85f64-5717-4562-b3fc-2c963f66afa6"]
                idRestriccion:
                  type: string
                  format: uuid
                  example: ["e1f2a3b4-c5d6-4789-0abc-ef1234567890"]
                tipoRestriccion:
                  $ref: '#/components/schemas/TipoRestriccion'
                edadMinima:
                  type: [integer, "null"]
                  example: [18]
                territoriosBloqueados:
                  type: array
                  items:
                    type: string
                  example: [[]]
                timestamp:
                  type: string
                  format: date-time
                  example: ["2026-06-18T10:00:00Z"]
      responses:
        '202':
          description: Evento recibido por los contextos suscriptores.
        '500':
          description: Error en el receptor. El broker reintentará el envío.

  restriccionLevantada:
    post:
      summary: Notificar que se levantó una restricción sobre un contenido (RF-C6 / RNF-4)
      description: |
        Evento asíncrono emitido cuando una restricción activa es eliminada. Si el
        contenido queda sin restricciones bloqueantes y vuelve a estado 'Publicado',
        se emite también el evento `contenidoPublicado`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idEvento, idItemCatalogo, idAsset, idCanal, idRestriccion, tipoRestriccion, timestamp]
              properties:
                idEvento:
                  type: string
                  format: uuid
                  example: ["d2e3f4a5-b6c7-4890-1234-def567890123"]
                idItemCatalogo:
                  type: string
                  format: uuid
                  example: ["7c9e6679-7425-40de-944b-e07fc1f90ae7"]
                idAsset:
                  type: string
                  format: uuid
                  example: ["d3b07384-d113-4956-a5db-2d1b331a0f2c"]
                idCanal:
                  type: string
                  format: uuid
                  example: ["3fa85f64-5717-4562-b3fc-2c963f66afa6"]
                idRestriccion:
                  type: string
                  format: uuid
                  example: ["e1f2a3b4-c5d6-4789-0abc-ef1234567890"]
                tipoRestriccion:
                  $ref: '#/components/schemas/TipoRestriccion'
                timestamp:
                  type: string
                  format: date-time
                  example: ["2026-06-19T08:00:00Z"]
      responses:
        '202':
          description: Evento recibido por los contextos suscriptores.
        '500':
          description: Error en el receptor. El broker reintentará el envío.

  reclamacionCreada:
    post:
      summary: Notificar que se registró una reclamación de derechos (RF-C5 / RNF-4)
      description: |
        Evento asíncrono emitido cuando se crea una reclamación de derechos. Puede ser
        consumido por sistemas de moderación o auditoría internos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idEvento, idReclamacion, idItemCatalogo, idCanal, tipoReclamacion, timestamp]
              properties:
                idEvento:
                  type: string
                  format: uuid
                  example: ["e3f4a5b6-c7d8-4901-2345-ef6789012345"]
                idReclamacion:
                  type: string
                  format: uuid
                  example: ["c1d2e3f4-a5b6-4789-0abc-def123456789"]
                idItemCatalogo:
                  type: string
                  format: uuid
                  example: ["7c9e6679-7425-40de-944b-e07fc1f90ae7"]
                idCanal:
                  type: string
                  format: uuid
                  example: ["3fa85f64-5717-4562-b3fc-2c963f66afa6"]
                tipoReclamacion:
                  $ref: '#/components/schemas/TipoReclamacion'
                timestamp:
                  type: string
                  format: date-time
                  example: ["2026-06-17T14:00:00Z"]
      responses:
        '202':
          description: Evento recibido por los sistemas suscriptores.
        '500':
          description: Error en el receptor. El broker reintentará el envío.

  reclamacionResuelta:
    post:
      summary: Notificar que se resolvió una reclamación de derechos (RF-C5 / RNF-4)
      description: |
        Evento asíncrono emitido cuando una reclamación es aceptada, disputada o retirada.
        Puede disparar cambios en la visibilidad del contenido que a su vez generan
        los eventos `contenidoPublicado`, `contenidoDespublicado` o `restriccionLevantada`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idEvento, idReclamacion, idItemCatalogo, idCanal, resolucion, timestamp]
              properties:
                idEvento:
                  type: string
                  format: uuid
                  example: ["f4a5b6c7-d8e9-4012-3456-f0123456789a"]
                idReclamacion:
                  type: string
                  format: uuid
                  example: ["c1d2e3f4-a5b6-4789-0abc-def123456789"]
                idItemCatalogo:
                  type: string
                  format: uuid
                  example: ["7c9e6679-7425-40de-944b-e07fc1f90ae7"]
                idCanal:
                  type: string
                  format: uuid
                  example: ["3fa85f64-5717-4562-b3fc-2c963f66afa6"]
                resolucion:
                  type: string
                  enum: [Aceptada, Disputada, Retirada]
                  example: ["Aceptada"]
                timestamp:
                  type: string
                  format: date-time
                  example: ["2026-06-18T09:00:00Z"]
      responses:
        '202':
          description: Evento recibido por los sistemas suscriptores.
        '500':
          description: Error en el receptor. El broker reintentará el envío.
