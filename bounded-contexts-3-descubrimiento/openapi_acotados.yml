openapi: 3.1.0
info:
  title: API de Descubrimiento y Personalización (Discovery)
  version: 1.0.0
  description: |
    ### Bounded Context 3 - Descubrimiento y Personalización.
    Responsable de búsqueda, feeds, recomendaciones, trending y señales.
    Solo trabaja con referencias a contenido (no streaming ni assets).
    
    * Consume eventos asíncronos de Catálogo para indexar contenido.
    * Consume eventos de Publicación para ajustar el Watch Time.

servers:
  - url: /api/v1/discovery

tags:
  - name: Search
  - name: Feed
  - name: Recommendations
  - name: Trending
  - name: Signals
  - name: Indexing (Webhooks)

paths:
  # =====================================================================
  # BÚSQUEDA Y NAVEGACIÓN
  # =====================================================================
  /search/videos:
    get:
      tags: [Search]
      summary: Buscar videos indexados
      operationId: searchVideos
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: duration
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"

  /search/channels:
    get:
      tags: [Search]
      summary: Buscar canales
      operationId: searchChannels
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelResult"

  /search/suggestions:
    get:
      tags: [Search]
      summary: Sugerencias de búsqueda (Autocompletar)
      operationId: getSearchSuggestions
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  # =====================================================================
  # FEEDS Y RECOMENDACIONES
  # =====================================================================
  /feeds/home/{idUsuario}:
    get:
      tags: [Feed]
      summary: Feed principal personalizado
      operationId: getHomeFeed
      parameters:
        - name: idUsuario
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/IdUsuario'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [recommendations]
                properties:
                  recommendations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Recommendation"
                  nextPage:
                    type: integer

  /recommendations/related/{idItemCatalogo}:
    get:
      tags: [Recommendations]
      summary: Contenido relacionado al video actual
      operationId: getRelatedContent
      parameters:
        - name: idItemCatalogo
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/IdItemCatalogo'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recommendation"

  # =====================================================================
  # TENDENCIAS (TRENDING)
  # =====================================================================
  /trending:
    get:
      tags: [Trending]
      summary: Trending global
      operationId: getTrending
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendingItem"

  /trending/{region}:
    get:
      tags: [Trending]
      summary: Trending regional
      operationId: getRegionalTrending
      parameters:
        - name: region
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendingItem"

  # =====================================================================
  # SEÑALES DIRECTAS (Frontend -> Backend)
  # =====================================================================
  /signals/impressions:
    post:
      tags: [Signals]
      summary: Registrar impresión visual en pantalla
      operationId: registerImpression
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpressionSignal"
      responses:
        "201":
          description: Created

  /signals/clicks:
    post:
      tags: [Signals]
      summary: Registrar CTR de miniatura
      operationId: registerClick
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClickSignal"
      responses:
        "201":
          description: Created

  # =====================================================================
  # INTEGRACIÓN ASÍNCRONA (Webhooks Internos)
  # =====================================================================
  /webhooks/catalogo/contenido-publicado:
    post:
      tags: [Indexing (Webhooks)]
      summary: Escucha cuando Catálogo publica un video para indexarlo en el buscador.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idEvento, idItemCatalogo, titulo, categoria]
              properties:
                idEvento:
                  type: string
                  format: uuid
                idItemCatalogo:
                  $ref: '#/components/schemas/IdItemCatalogo'
                titulo:
                  type: string
                categoria:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        "202":
          description: Evento aceptado. El video ahora es buscable.

  /webhooks/catalogo/contenido-despublicado:
    post:
      tags: [Indexing (Webhooks)]
      summary: Escucha cuando Catálogo retira un video para sacarlo del buscador.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idEvento, idItemCatalogo]
              properties:
                idEvento:
                  type: string
                  format: uuid
                idItemCatalogo:
                  $ref: '#/components/schemas/IdItemCatalogo'
      responses:
        "202":
          description: Evento aceptado. Contenido desindexado.

  /webhooks/publicacion/sesion-completada:
    post:
      tags: [Indexing (Webhooks)]
      summary: Escucha a Publicación (C1) para computar el Watch Time real.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idEvento, idItemCatalogo, idUsuario, segundosVistos]
              properties:
                idEvento:
                  type: string
                  format: uuid
                idItemCatalogo:
                  $ref: '#/components/schemas/IdItemCatalogo'
                idUsuario:
                  $ref: '#/components/schemas/IdUsuario'
                segundosVistos:
                  type: integer
      responses:
        "202":
          description: Evento aceptado. Algoritmo de recomendación actualizado.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    IdItemCatalogo:
      type: string
      format: uuid
      description: Identificador global del video público.
      examples:
        - "7c9e6679-7425-40de-944b-e07fc1f90ae7"

    IdCanal:
      type: string
      format: uuid
      description: Identificador global del canal creador.
      examples:
        - "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    IdUsuario:
      type: string
      format: uuid
      description: Identificador global del espectador.
      examples:
        - "e4e0a812-c224-4b93-84b2-3c22119d8541"

    SearchResult:
      type: object
      required: [idItemCatalogo, title]
      properties:
        idItemCatalogo:
          $ref: '#/components/schemas/IdItemCatalogo'
        title:
          type: string
        description:
          type: string
        thumbnail:
          type: string
          format: uri
        channelName:
          type: string

    ChannelResult:
      type: object
      required: [idCanal, name]
      properties:
        idCanal:
          $ref: '#/components/schemas/IdCanal'
        name:
          type: string
        subscribers:
          type: integer
          minimum: 0
        thumbnail:
          type: string
          format: uri

    Recommendation:
      type: object
      required: [idItemCatalogo, title, score]
      properties:
        idItemCatalogo:
          $ref: '#/components/schemas/IdItemCatalogo'
        title:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 1
        reason:
          type: string

    TrendingItem:
      type: object
      required: [idItemCatalogo, title, rank]
      properties:
        idItemCatalogo:
          $ref: '#/components/schemas/IdItemCatalogo'
        title:
          type: string
        rank:
          type: integer
          minimum: 1
        region:
          type: string
        views:
          type: integer
          minimum: 0

    ImpressionSignal:
      type: object
      required: [idUsuario, idItemCatalogo, timestamp]
      properties:
        idUsuario:
          $ref: '#/components/schemas/IdUsuario'
        idItemCatalogo:
          $ref: '#/components/schemas/IdItemCatalogo'
        feedType:
          type: string
        timestamp:
          type: string
          format: date-time

    ClickSignal:
      type: object
      required: [idUsuario, idItemCatalogo, timestamp]
      properties:
        idUsuario:
          $ref: '#/components/schemas/IdUsuario'
        idItemCatalogo:
          $ref: '#/components/schemas/IdItemCatalogo'
        timestamp:
          type: string
          format: date-time
