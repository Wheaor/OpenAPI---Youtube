openapi: 3.1.0
info:
  title: API de Audiencia, Comunidad y Engagement
  version: 1.0.0
  description: |
    ### Bounded Context 4 - Audiencia, Comunidad y Engagement.
    Gestiona suscripciones, reacciones, comentarios, notificaciones, 
    historial de visualización y publicaciones de comunidad.
    
    * Consume eventos asíncronos de Publicación (C1) para armar el historial.
    * Consume eventos asíncronos de Catálogo (C2) y Publicación (C1) para disparar notificaciones.

servers:
  - url: /api/v1/audience

tags:
  - name: Subscriptions
  - name: Reactions
  - name: Comments
  - name: Notifications
  - name: History
  - name: Community
  - name: Integración (Webhooks)

paths:
  # =====================================================================
  # SUSCRIPCIONES
  # =====================================================================
  /subscriptions:
    post:
      tags: [Subscriptions]
      summary: Suscribirse a un canal
      operationId: subscribeChannel
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionRequest"
      responses:
        "201":
          description: Created

  /subscriptions/{idUsuario}:
    get:
      tags: [Subscriptions]
      summary: Listar canales suscritos por usuario
      operationId: getUserSubscriptions
      parameters:
        - name: idUsuario
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/IdUsuario'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Suscripcion"

  /subscriptions/{idSuscripcion}:
    delete:
      tags: [Subscriptions]
      summary: Cancelar suscripción
      operationId: unsubscribeChannel
      parameters:
        - name: idSuscripcion
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted

  # =====================================================================
  # REACCIONES
  # =====================================================================
  /reactions:
    post:
      tags: [Reactions]
      summary: Crear o actualizar reacción (Like/Dislike)
      operationId: upsertReaction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionRequest"
      responses:
        "201":
          description: Created/Updated

  /reactions/{idUsuario}/{idItemCatalogo}:
    delete:
      tags: [Reactions]
      summary: Eliminar reacción
      operationId: deleteReaction
      parameters:
        - name: idUsuario
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/IdUsuario'
        - name: idItemCatalogo
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/IdItemCatalogo'
      responses:
        "200":
          description: Deleted

  /reactions/{idItemCatalogo}/stats:
    get:
      tags: [Reactions]
      summary: Obtener conteo de reacciones de un video
      operationId: getReactionStats
      parameters:
        - name: idItemCatalogo
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/IdItemCatalogo'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionStats"

  # =====================================================================
  # COMENTARIOS
  # =====================================================================
  /comments:
    post:
      tags: [Comments]
      summary: Crear comentario
      operationId: createComment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "201":
          description: Created

    get:
      tags: [Comments]
      summary: Listar comentarios de un contenido
      operationId: listComments
      parameters:
        - name: idItemCatalogo
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/IdItemCatalogo'
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent, top]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comentario"

  /comments/{idComentario}:
    put:
      tags: [Comments]
      summary: Editar comentario
      operationId: editComment
      parameters:
        - name: idComentario
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                texto:
                  type: string
      responses:
        "200":
          description: Updated

    delete:
      tags: [Comments]
      summary: Eliminar comentario
      operationId: deleteComment
      parameters:
        - name: idComentario
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted

  /comments/{idComentario}/report:
    post:
      tags: [Moderation]
      summary: Reportar comentario por abuso
      operationId: reportComment
      parameters:
        - name: idComentario
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo:
                  type: string
      responses:
        "201":
          description: Reported

  # =====================================================================
  # NOTIFICACIONES E HISTORIAL (Lectura)
  # =====================================================================
  /notifications/{idUsuario}:
    get:
      tags: [Notifications]
      summary: Listar notificaciones del usuario
      operationId: getNotifications
      parameters:
        - name: idUsuario
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/IdUsuario'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notificacion"

  /history/{idUsuario}:
    get:
      tags: [History]
      summary: Obtener el historial de visualización (armado por eventos)
      operationId: getWatchHistory
      parameters:
        - name: idUsuario
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/IdUsuario'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistorialVisualizacion"

  # =====================================================================
  # COMUNIDAD
  # =====================================================================
  /community-posts:
    post:
      tags: [Community]
      summary: Crear publicación de comunidad (Post de texto/imagen)
      operationId: createCommunityPost
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityPostRequest"
      responses:
        "201":
          description: Created

  /community-posts/{idCanal}:
    get:
      tags: [Community]
      summary: Listar posts de comunidad de un canal
      operationId: listCommunityPosts
      parameters:
        - name: idCanal
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/IdCanal'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicacionComunidad"

  # =====================================================================
  # INTEGRACIÓN ASÍNCRONA (Webhooks Internos)
  # =====================================================================
  /webhooks/publicacion/sesion-completada:
    post:
      tags: [Integración (Webhooks)]
      summary: Escucha a Publicación (C1) para construir el historial de visualización.
      description: |
        Cuando el reproductor informa que el usuario terminó de ver un video, 
        este contexto lo agrega a su historial personal (RF-P3).
      security:
        - BearerAuth: [] # Rol: Sistema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idEvento, idItemCatalogo, idUsuario, timestamp]
              properties:
                idEvento:
                  type: string
                  format: uuid
                idItemCatalogo:
                  $ref: '#/components/schemas/IdItemCatalogo'
                idUsuario:
                  $ref: '#/components/schemas/IdUsuario'
                timestamp:
                  type: string
                  format: date-time
      responses:
        "202":
          description: Historial de usuario actualizado.

  /webhooks/catalogo/contenido-publicado:
    post:
      tags: [Integración (Webhooks)]
      summary: Escucha a Catálogo (C2) para disparar notificaciones de "Nuevo Video".
      description: |
        Si el canal que publicó el video tiene suscriptores, el motor de notificaciones
        les envía una alerta.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idEvento, idItemCatalogo, idCanal, titulo]
              properties:
                idEvento:
                  type: string
                  format: uuid
                idItemCatalogo:
                  $ref: '#/components/schemas/IdItemCatalogo'
                idCanal:
                  $ref: '#/components/schemas/IdCanal'
                titulo:
                  type: string
      responses:
        "202":
          description: Evento aceptado. Notificaciones encoladas.

  /webhooks/publicacion/transmision-vivo:
    post:
      tags: [Integración (Webhooks)]
      summary: Escucha a Publicación (C1) para notificar "Canal en Vivo".
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idEvento, idCanal, estado]
              properties:
                idEvento:
                  type: string
                  format: uuid
                idCanal:
                  $ref: '#/components/schemas/IdCanal'
                estado:
                  type: string
                  examples: ["EnVivo"]
      responses:
        "202":
          description: Notificaciones de Live encoladas.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    IdItemCatalogo:
      type: string
      format: uuid
      description: Identificador global del video.
      examples: ["7c9e6679-7425-40de-944b-e07fc1f90ae7"]

    IdCanal:
      type: string
      format: uuid
      description: Identificador global del canal creador.
      examples: ["3fa85f64-5717-4562-b3fc-2c963f66afa6"]

    IdUsuario:
      type: string
      format: uuid
      description: Identificador global del espectador/usuario interactuando.
      examples: ["e4e0a812-c224-4b93-84b2-3c22119d8541"]

    Suscripcion:
      type: object
      required: [idSuscripcion, idUsuario, idCanal]
      properties:
        idSuscripcion:
          type: string
          format: uuid
        idUsuario:
          $ref: '#/components/schemas/IdUsuario'
        idCanal:
          $ref: '#/components/schemas/IdCanal'
        fechaSuscripcion:
          type: string
          format: date-time

    SubscriptionRequest:
      type: object
      required: [idUsuario, idCanal]
      properties:
        idUsuario:
          $ref: '#/components/schemas/IdUsuario'
        idCanal:
          $ref: '#/components/schemas/IdCanal'

    ReactionRequest:
      type: object
      required: [idUsuario, idItemCatalogo, type]
      properties:
        idUsuario:
          $ref: '#/components/schemas/IdUsuario'
        idItemCatalogo:
          $ref: '#/components/schemas/IdItemCatalogo'
        type:
          type: string
          enum: [Like, Dislike]

    ReactionStats:
      type: object
      properties:
        idItemCatalogo:
          $ref: '#/components/schemas/IdItemCatalogo'
        likes:
          type: integer
          minimum: 0
        dislikes:
          type: integer
          minimum: 0

    Comentario:
      type: object
      required: [idComentario, idItemCatalogo, idUsuario, texto]
      properties:
        idComentario:
          type: string
          format: uuid
        idItemCatalogo:
          $ref: '#/components/schemas/IdItemCatalogo'
        idUsuario:
          $ref: '#/components/schemas/IdUsuario'
        texto:
          type: string
        fechaCreacion:
          type: string
          format: date-time
        fijado:
          type: boolean

    CommentRequest:
      type: object
      required: [idItemCatalogo, idUsuario, texto]
      properties:
        idItemCatalogo:
          $ref: '#/components/schemas/IdItemCatalogo'
        idUsuario:
          $ref: '#/components/schemas/IdUsuario'
        texto:
          type: string
        parentId:
          type: string
          format: uuid

    Notificacion:
      type: object
      properties:
        idNotificacion:
          type: string
          format: uuid
        idUsuario:
          $ref: '#/components/schemas/IdUsuario'
        mensaje:
          type: string
        estado:
          type: string
          enum: [NoLeida, Leida]
        fechaCreacion:
          type: string
          format: date-time

    HistorialVisualizacion:
      type: object
      properties:
        idHistorial:
          type: string
          format: uuid
        idUsuario:
          $ref: '#/components/schemas/IdUsuario'
        idItemCatalogo:
          $ref: '#/components/schemas/IdItemCatalogo'
        fechaVisualizacion:
          type: string
          format: date-time

    PublicacionComunidad:
      type: object
      properties:
        idPublicacion:
          type: string
          format: uuid
        idCanal:
          $ref: '#/components/schemas/IdCanal'
        contenido:
          type: string
        fechaPublicacion:
          type: string
          format: date-time

    CommunityPostRequest:
      type: object
      required: [idCanal, contenido]
      properties:
        idCanal:
          $ref: '#/components/schemas/IdCanal'
        contenido:
          type: string
